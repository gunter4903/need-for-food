spring:
  application:
    name: need-for-food-backend
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # SMTP pour l'e-mail de vérification de compte. Par défaut (localhost:1025) ne pointe vers
  # rien de démarré — l'échec d'envoi n'empêche jamais l'inscription (voir EmailService), le
  # code est aussi journalisé en clair pour le dev local. Renseigner MAIL_HOST/MAIL_USERNAME/
  # MAIL_PASSWORD/MAIL_FROM (ex: dans .env, non commité) avec un vrai fournisseur SMTP (Brevo,
  # Gmail, etc.) pour un envoi réel.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

app:
  jwt:
    # En production, JWT_SECRET doit être défini via variable d'environnement (256 bits minimum).
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # URL publique de base de l'API, utilisée pour construire les URLs des images statiques
  # (ex: photo de la recette de bienvenue). Doit correspondre à l'hôte joignable par le client
  # mobile (EXPO_PUBLIC_API_URL sans le suffixe /api) — voir need-for-food-mobile/.env.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@needforfood.dev}
    verification-code-expiration-minutes: ${MAIL_VERIFICATION_EXPIRATION_MINUTES:15}
