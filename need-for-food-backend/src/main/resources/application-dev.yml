spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:need_for_food}
    username: ${DB_USERNAME:need_for_food}
    password: ${DB_PASSWORD:need_for_food}

  jpa:
    show-sql: true

  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:need_for_food}:${MONGO_PASSWORD:need_for_food}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:need_for_food}?authSource=admin

logging:
  level:
    org.hibernate.SQL: debug

app:
  # IP locale utilisée pour tester depuis un téléphone physique sur le même réseau Wi-Fi
  # (doit correspondre à EXPO_PUBLIC_API_URL dans need-for-food-mobile/.env, sans /api).
  base-url: ${APP_BASE_URL:http://192.168.1.60:8080}
