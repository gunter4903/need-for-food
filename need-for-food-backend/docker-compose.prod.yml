services:
  postgres:
    ports: !reset []

  pgadmin:
    ports: !reset []

  mongodb:
    ports: !reset []

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: ${APP_BASE_URL}
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: need-for-food-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
