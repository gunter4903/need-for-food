services:
  postgres:
    image: postgres:16-alpine
    container_name: need-for-food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-need_for_food}
      POSTGRES_USER: ${DB_USERNAME:-need_for_food}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-need_for_food}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-need_for_food} -d ${DB_NAME:-need_for_food}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: need-for-food-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@needforfood.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
