services:
  postgres:
    image: postgres:16-alpine
    container_name: need-for-food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-need_for_food}
      POSTGRES_USER: ${DB_USERNAME:-need_for_food}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-need_for_food}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-need_for_food} -d ${DB_NAME:-need_for_food}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: need-for-food-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@needforfood.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mongodb:
    image: mongo:7
    container_name: need-for-food-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-need_for_food}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-need_for_food}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-need_for_food}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: need-for-food-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-need_for_food}
      DB_USERNAME: ${DB_USERNAME:-need_for_food}
      DB_PASSWORD: ${DB_PASSWORD:-need_for_food}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-need_for_food}
      MONGO_USERNAME: ${MONGO_USERNAME:-need_for_food}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-need_for_food}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-32-bytes-minimum}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@needforfood.dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  mongodb_data:
